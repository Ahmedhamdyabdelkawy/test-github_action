on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
    paths:
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: solve error  
      run: sudo chown -R 501:20 “/Users/myusername/.npm 

      
    - name: Update npm to the latest version
      run: npm install -g npm@latest


    - name: Clean npm cache
      run: npm cache clean --force


    

    - name: Install dependencies
      run: npm install


    - name: Run tests
      run: npm test